<section class="account-head" data-account-page="{{param_id}}">
  <a class="back" href="/">← Resumen</a>
  <p class="eyebrow" id="acc-type">Cuenta</p>
  <h1 id="acc-name">Cuenta</h1>
  <p class="total" id="acc-balance"><span class="skeleton" style="display:inline-block;width:5em;height:.8em"></span></p>
  <p class="hero-meta"><span class="mono" id="acc-iban"></span> <button class="link-btn" type="button" id="copy-iban">Copiar IBAN</button></p>
  <div class="actions" style="margin-top:16px"><a class="btn btn-primary" id="acc-transfer" href="/transferir">Transferir desde esta cuenta</a></div>
</section>
<section aria-labelledby="acc-moves-title" style="margin-top:32px">
  <div class="section-head"><h2 id="acc-moves-title">Movimientos</h2>
    <label class="search"><span class="sr-only">Buscar en los movimientos</span><input type="search" id="acc-search" placeholder="Buscar concepto o persona" autocomplete="off"></label></div>
  <div class="panel"><div id="acc-moves"></div></div>
</section>
