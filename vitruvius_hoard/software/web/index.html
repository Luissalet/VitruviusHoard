<!doctype html><html lang="es" data-hoard-app="vitruvius"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitruvius's Hoard</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/theme/hoard-theme.css"><link rel="stylesheet" href="/workbench/workspace.css"><script type="module" src="/workbench/workspace.js"></script></head><body>
<a class="skip" href="#project">Ir al proyecto</a><header><img src="/icon.png" alt="" width="40" height="40"><h1>Vitruvius's Hoard</h1><label>Idioma / Language <select id="lang"><option value="es">Español</option><option value="en">English</option></select></label></header>
<main><section aria-labelledby="modules-title"><h2 id="modules-title" data-t="modules">Módulos</h2><div id="modules"></div><p id="theseus-note" class="notice"></p><a href="/api/software/theseus-limits" target="_blank" data-t="limits">Capacidades y límites de Theseus</a></section>
<section id="project"><h2 data-t="project">Proyecto y revisión</h2><div class="toolbar"><label><span data-t="project">Proyecto y revisión</span><select id="projects"></select></label><label><span data-t="revision">Revisión</span><select id="revisions"></select></label><button id="reload" data-t="reload">Actualizar</button><a id="editor" href="/design/#/projects" data-t="editor">Abrir editor</a></div><form id="create"><label><span data-t="name">Nombre del proyecto</span><input id="name" required></label><button data-t="create">Crear proyecto</button></form><p id="identity"></p>
<div class="workspace"><div><label><span data-t="file">Archivo</span><select id="files"></select></label><label><span data-t="source">Fuente editable</span><textarea id="source" rows="20" spellcheck="false"></textarea></label><button id="save-source" data-t="save">Guardar nueva revisión</button><a id="export" data-t="export">Exportar fuente independiente</a></div>
<div><h3 data-t="environment">Entorno de comprobación</h3><label><span data-t="env">Entorno nativo</span><select id="environments"></select></label><button id="link-env" data-t="link">Asociar a esta revisión</button><label><span data-t="envpath">Registrar intérprete o carpeta de proyecto</span><input id="envpath"></label><button id="register" data-t="register">Registrar y asociar</button><button id="check" data-t="check">Comprobar archivo</button>
<h3 data-t="inspection">Inspección existente</h3><label><span data-t="native">Proyecto Theseus existente (opcional)</span><input id="native-project"></label><button id="inspect" data-t="inspect">Asociar archivo a Theseus</button><label><span data-t="artifact">Artefacto nativo</span><select id="artifacts"></select></label><label><span data-t="operation">Operación existente</span><select id="operations"></select></label><label><span data-t="parameters">Parámetros JSON</span><textarea id="parameters" rows="3">{}</textarea></label><button id="analyze" data-t="analyze">Solicitar análisis</button><label><span data-t="job">Trabajo nativo</span><input id="job"></label><button id="retain" data-t="retain">Consultar y conservar resultado</button><a id="inspection-editor" href="/theseus/" data-t="inspectionEditor">Abrir taller nativo</a></div></div>
</section><section><h2 data-t="history">Resultados y procedencia conservados</h2><div id="history"></div><pre id="result"></pre></section><p id="status" role="status" aria-live="polite"></p></main><script src="/api/copilot/launcher.js" defer></script></body></html>
