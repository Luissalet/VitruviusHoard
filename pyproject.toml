[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vitruvius-hoard"
version = "0.1.0"
description = "A local frontend-design workbench: a criterion library, a render-capture-critique loop on real Chromium, a design-system (tokens) generator and a reference gallery, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.26,<2",
  "griffe>=2.3,<3",
  "pefile>=2024.8",
  "python-multipart>=0.0.20",
  "psutil>=5.9",
  "jsonschema>=4.20,<5",
  "websocket-client>=1.9",
  "websockets>=14",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyelftools>=0.32", "aioquic>=1.2", "websockets>=14"]
icon = ["pillow>=11", "numpy>=2"]
vectors = ["numpy>=2", "fastembed>=0.5"]
render = ["playwright>=1.45"]
runtime = ["frida==17.24.2"]

[project.scripts]
vitruvius-hoard = "vitruvius_hoard.__main__:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.cmdclass]
build_py = "software_native.firmware_build.BuildPy"
bdist_wheel = "software_native.firmware_build.BdistWheel"

[tool.setuptools.packages.find]
include = ["vitruvius_hoard*", "babels_hoard*", "theseus*", "hoard_link*", "software_native*", "babel_client*"]
exclude = ["theseus_tests*", "babel_tests*"]
namespaces = false

[tool.setuptools.package-data]
"vitruvius_hoard.software" = ["catalog.json", "web/*"]
"babels_hoard" = ["probes/*", "LICENSE"]
"theseus" = ["LICENSE", "process_shim.cs"]
"babels_hoard.hoard_link" = ["ui/*", "_data/*", "LICENSE", "VENDORED.txt"]
"vitruvius_hoard.hoard_link" = ["ui/*", "_data/*", "LICENSE", "VENDORED.txt"]
"hoard_link" = ["ui/*", "_data/*", "LICENSE", "VENDORED.txt"]
"babel_client" = ["dist/*", "dist/assets/*"]
"software_native" = ["theseus-limits.md", "theseus_web/*", "engine/*.ts", "engine/*.mjs", "engine/*.json", "engine/LICENSE*", "engine/NOTICE.md", "engine/PROVENANCE.json", "engine/src/**/*", "engine/bridge/**/*.java", "engine/dist/*.js", "engine/dist/**/*.js", "engine/firmware-scanner/Cargo.toml", "engine/firmware-scanner/Cargo.lock", "engine/firmware-scanner/LICENSE-BINWALK", "engine/firmware-scanner/NOTICE.md", "engine/firmware-scanner/PROVENANCE.json", "engine/firmware-scanner/src/*.rs"]
vitruvius_hoard = ["LICENSE", "static/*", "static/**/*", "seeds.json", "functional_check/LICENSE-MIT", "functional_check/PROVENANCE.json", "functional_check/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
