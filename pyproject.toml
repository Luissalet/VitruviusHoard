[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitruvius-hoard"
version = "0.1.0"
description = "A local frontend-design workbench: a criterion library, a render-capture-critique loop on real Chromium, a design-system (tokens) generator and a reference gallery, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "playwright>=1.45",
  "fastembed>=0.5",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
icon = ["pillow>=11", "numpy>=2"]
vectors = ["numpy>=2"]

[project.scripts]
vitruvius-hoard = "vitruvius_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["vitruvius_hoard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
